spring.application.name=reservation-service
server.port=8082

spring.datasource.url=jdbc:mysql://localhost:3307/reservation_db
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# JWT verification. Point this at the identity-access-service JWK Set endpoint at runtime, e.g.:
# spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8080/api/v1/jwks
reservation-service.jwt.roles-claim=roles

facility-resource-service.base-url=${FACILITY_SERVICE_URL:http://localhost:8081}