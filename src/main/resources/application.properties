spring.application.name=reservation-service
server.port=8082

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:reservationdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Group 5 Identity Service configuration
identity-service.base-url=${IDENTITY_SERVICE_URL:http://localhost:8001}
reservation-service.jwt.roles-claim=roles
reservation-service.jwt.required-issuer=university-identity-service
reservation-service.jwt.required-audience=university-services-platform

facility-resource-service.base-url=${FACILITY_SERVICE_URL:http://localhost:8081}
group5.integration.enabled=${GROUP5_INTEGRATION_ENABLED:true}