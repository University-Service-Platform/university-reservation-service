server.port=8082

spring.datasource.url=jdbc:h2:mem:reservationdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

identity-service.base-url=${IDENTITY_SERVICE_URL:http://localhost:8001}
facility-resource-service.base-url=${FACILITY_SERVICE_URL:http://localhost:8081}
reservation-service.jwt.roles-claim=roles
group5.integration.enabled=${GROUP5_INTEGRATION_ENABLED:false}